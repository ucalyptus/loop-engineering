name = "calc-shadow"
goal = "calc.py arithmetic behaves as test_calc.py specifies."
workdir = "."

# Failure demo: shadow.py adds a unittest.py that always exits 0. The denylist gate misses the new file,
# so the loop "converges" (exit 0) while calc.py is still broken. A false pass.
actor = "python3 shadow.py"
fresh_clone = true

[[checks]]
name = "add"
run = "python3 -m unittest -q test_calc.TestCalc.test_add"

[[checks]]
name = "sub"
run = "python3 -m unittest -q test_calc.TestCalc.test_sub"

[[checks]]
name = "mul"
run = "python3 -m unittest -q test_calc.TestCalc.test_mul"

[[checks]]
name = "div"
run = "python3 -m unittest -q test_calc.TestCalc.test_div"

[[admission]]
name = "tests-unchanged"
run = "git diff --cached --quiet -- test_calc.py"

[limits]
max_iterations = 10
max_diff_lines = 20
stall_iterations = 3
max_regressions = 2
backoff_base_s = 0.2
