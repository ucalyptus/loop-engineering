name = "calc-bend-cheat"
goal = "calc.bend satisfies every law in laws_*.bend, with machine-checked proofs in proof_*.bend."
workdir = "."

# Failure demo: cheat.py never fixes calc.bend. It tries three ways to fake the `add` proof.
# Admission rejects the first two; the proof checker refuses the third. Expect "unreachable" (exit 2).
actor = "python3 cheat.py"
fresh_clone = true

[[checks]]
name = "add"
run = "bend check_add.bend --verdict"

[[checks]]
name = "mul"
run = "bend check_mul.bend --verdict"

[[checks]]
name = "double"
run = "bend check_double.bend --verdict"

# The laws and the check entry files are the spec and the sensors: hands off.
[[admission]]
name = "spec-frozen"
run = "git diff --cached --quiet -- 'laws_*.bend' 'check_*.bend'"

# Allowlist, not denylist: the agent may change calc.bend and proof_*.bend, nothing else.
# A denylist misses new files, such as a weaker copy of the laws.
[[admission]]
name = "allowlist"
run = '! git diff --cached --name-only --relative | grep -vxE "calc[.]bend|proof_(add|mul|double)[.]bend"'

[limits]
max_iterations = 10
max_diff_lines = 60
stall_iterations = 3
max_regressions = 2
backoff_base_s = 0.2
