name = "calc-pi"
goal = "calc.py arithmetic behaves as test_calc.py specifies."
workdir = "."

# Worker: pi in one-shot mode. loopctl pipes the prompt on stdin; "$(cat)" hands it to pi.
# Swap in any agent CLI the same way, e.g. 'claude -p --permission-mode acceptEdits "$(cat)"'.
actor = 'pi -p "$(cat)"'
actor_timeout_s = 600

fresh_clone = true

[[checks]]
name = "add"
run = "python3 -m unittest -q test_calc.TestCalc.test_add"

[[checks]]
name = "sub"
run = "python3 -m unittest -q test_calc.TestCalc.test_sub"

[[checks]]
name = "mul"
run = "python3 -m unittest -q test_calc.TestCalc.test_mul"

[[checks]]
name = "div"
run = "python3 -m unittest -q test_calc.TestCalc.test_div"

# A real agent might "fix" the test instead of the code. Block that.
[[admission]]
name = "tests-unchanged"
run = "git diff --cached --quiet -- test_calc.py"

[limits]
max_iterations = 8
max_actor_seconds = 900
max_diff_lines = 20
stall_iterations = 3
max_regressions = 2
